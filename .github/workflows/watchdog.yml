name: Product watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check website
        run: |
          if curl --fail --silent --show-error https://ageevd-commits.github.io/MultiCallculator/ > /dev/null; then
            echo "Site is available"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🔴 MultiCallculator не отвечает"
            exit 1
          fi

      - name: Send daily heartbeat
        if: github.event.schedule == '0 6 * * *'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ MultiCallculator: мониторинг работает"
