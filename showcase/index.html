<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Витрина калькуляторов</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1f2933;
      --muted: #667085;
      --line: #eaecf0;
      --surface: #ffffff;
      --background: #f4f6f8;
      --accent: #111827;
    }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: Arial, sans-serif;
    }
    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 24px;
    }
    header {
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
    }
    .intro {
      max-width: 720px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .category {
      margin: 0;
    }
    .categoryTitle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
      font-size: 22px;
    }
    .categoryTitle::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }
    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .cardHeader {
      min-height: 190px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
      border-top: 4px solid var(--accent);
    }
    h2, h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .description {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .calculatorFrame {
      display: block;
      width: 100%;
      height: 820px;
      border: 0;
      background: #f4f6f8;
    }
    .status {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #f9fafb;
      line-height: 1.5;
    }
    [hidden] { display: none !important; }
    .grid.isExpanded { grid-template-columns: minmax(0, 1fr); }
    .isExpanded .cardHeader { min-height: auto; }
    .action {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: var(--accent);
      color: var(--surface);
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .action:hover { background: var(--surface); color: var(--accent); }
    .action:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .action:disabled { cursor: wait; }
    .status { margin-bottom: 20px; }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      .page { padding: 24px 12px 32px; }
      .grid { grid-template-columns: 1fr; }
      .cardHeader { min-height: auto; }
      .calculatorFrame { height: 760px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Витрина MultiCallculator</h1>
      <p class="intro">Все рабочие калькуляторы продукта собраны на одной странице. Каждый экран сохраняет собственную форму, расчёт и интерактивность.</p>
    </header>
    <main>
      <section class="category" aria-labelledby="categoryTitle">
        <h2 class="categoryTitle" id="categoryTitle">Калькуляторы</h2>
        <div class="status" id="loadStatus" role="status" aria-live="polite">Загружаем калькуляторы…</div>
        <button class="action" id="retryButton" type="button" hidden>Повторить загрузку</button>
        <div class="grid" id="calculatorGrid" aria-busy="true"></div>
      </section>
    </main>
  </div>
  <script>
    const calculatorDescriptions = [
      "Экспресс-оценка сложных объектов после пожара с детализацией работ, сроков и экономики.",
      "Предварительный диапазон стоимости абразивоструйной очистки металлоконструкций.",
      "Оценка очистки кирпичного фасада с дополнительными работами и сохранением расчётов."
    ];
    const calculatorGrid = document.getElementById("calculatorGrid");

    const loadStatus = document.getElementById("loadStatus");
    const retryButton = document.getElementById("retryButton");
    let loading = false;

    function showError() {
      loadStatus.hidden = false;
      loadStatus.textContent = "Не удалось загрузить калькуляторы. Проверьте подключение и повторите загрузку.";
      retryButton.hidden = false;
    }

    function toggleCalculator(card, button) {
      const expanded = button.getAttribute("aria-expanded") !== "true";
      calculatorGrid.classList.toggle("isExpanded", expanded);
      Array.from(calculatorGrid.children).forEach(other => {
        other.hidden = expanded && other !== card;
      });
      button.setAttribute("aria-expanded", String(expanded));
      button.textContent = expanded ? "Вернуться к трём калькуляторам" : "Развернуть калькулятор";
      // Keep the same iframe in place: changing srcdoc or reparenting resets input.
      button.focus({ preventScroll: true });
      card.scrollIntoView({ block: "start", behavior: "instant" });
    }

    function createCalculatorCard(sourceFrame, index) {
      const card = document.createElement("article");
      card.className = "card";

      const cardHeader = document.createElement("div");
      cardHeader.className = "cardHeader";

      const title = document.createElement("h3");
      title.textContent = ["Пожар", "Металл", "АСТ кирпич_фасад"][index];
      cardHeader.appendChild(title);

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = calculatorDescriptions[index];
      cardHeader.appendChild(description);

      const frame = document.createElement("iframe");
      frame.className = "calculatorFrame";
      frame.id = `calculator-${index}`;
      frame.title = sourceFrame.title;
      frame.srcdoc = sourceFrame.getAttribute("srcdoc");

      const expandButton = document.createElement("button");
      expandButton.type = "button";
      expandButton.className = "action";
      expandButton.textContent = "Развернуть калькулятор";
      expandButton.setAttribute("aria-expanded", "false");
      expandButton.setAttribute("aria-controls", frame.id);
      expandButton.addEventListener("click", () => toggleCalculator(card, expandButton));
      cardHeader.appendChild(expandButton);

      card.appendChild(cardHeader);
      card.appendChild(frame);
      return card;
    }

    async function loadShowcase() {
      if (loading) return;
      loading = true;
      retryButton.disabled = true;
      loadStatus.hidden = false;
      loadStatus.textContent = "Загружаем калькуляторы…";
      calculatorGrid.setAttribute("aria-busy", "true");
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch("../index.html", { signal: controller.signal });
        if (!response.ok) {
          throw new Error(`Не удалось загрузить index.html (HTTP ${response.status}).`);
        }

        const html = await response.text();
        const documentFromSource = new DOMParser().parseFromString(html, "text/html");
        const sourceFrames = Array.from(documentFromSource.querySelectorAll("iframe[srcdoc]"));

        if (sourceFrames.length !== 3) {
          throw new Error(`В index.html найдено ${sourceFrames.length} iframe вместо трёх.`);
        }

        const cards = sourceFrames.map(createCalculatorCard);
        calculatorGrid.replaceChildren(...cards);
        loadStatus.hidden = true;
        const retryHadFocus = document.activeElement === retryButton;
        retryButton.hidden = true;
        if (retryHadFocus) cards[0].querySelector("button").focus();
      } catch (error) {
        showError();
      } finally {
        clearTimeout(timeout);
        loading = false;
        retryButton.disabled = false;
        calculatorGrid.setAttribute("aria-busy", "false");
      }
    }

    retryButton.addEventListener("click", loadShowcase);
    loadShowcase();
  </script>
</body>
</html>
