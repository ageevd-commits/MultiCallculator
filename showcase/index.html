<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Витрина калькуляторов</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #17212b;
      --muted: #607080;
      --line: #d9e1e8;
      --surface: #ffffff;
      --background: #eef3f6;
      --accent: #0b6e69;
    }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font-family: Arial, sans-serif;
    }
    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 34px 24px 48px;
    }
    header {
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
    }
    .intro {
      max-width: 720px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .category {
      margin: 0;
    }
    .categoryTitle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
      font-size: 22px;
    }
    .categoryTitle::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }
    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.08);
    }
    .cardHeader {
      min-height: 112px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      border-top: 4px solid var(--accent);
    }
    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .description {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .calculatorFrame {
      display: block;
      width: 100%;
      height: 820px;
      border: 0;
      background: #f4f6f8;
    }
    .status {
      padding: 28px;
      border: 1px solid #e2b9b9;
      border-radius: 10px;
      color: #8a2525;
      background: #fff5f5;
      line-height: 1.5;
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      .page { padding: 24px 12px 32px; }
      .grid { grid-template-columns: 1fr; }
      .cardHeader { min-height: auto; }
      .calculatorFrame { height: 760px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Витрина MultiCallculator</h1>
      <p class="intro">Все рабочие калькуляторы продукта собраны на одной странице. Каждый экран сохраняет собственную форму, расчёт и интерактивность.</p>
    </header>
    <main>
      <section class="category" aria-labelledby="categoryTitle">
        <h2 class="categoryTitle" id="categoryTitle">Калькуляторы</h2>
        <div class="grid" id="calculatorGrid"></div>
      </section>
    </main>
  </div>
  <script>
    const calculatorDescriptions = [
      "Экспресс-оценка сложных объектов после пожара с детализацией работ, сроков и экономики.",
      "Предварительный диапазон стоимости абразивоструйной очистки металлоконструкций.",
      "Оценка очистки кирпичного фасада с дополнительными работами и сохранением расчётов."
    ];
    const calculatorGrid = document.getElementById("calculatorGrid");

    function showError(message) {
      calculatorGrid.innerHTML = "";
      const error = document.createElement("div");
      error.className = "status";
      error.setAttribute("role", "alert");
      error.textContent = message;
      calculatorGrid.appendChild(error);
    }

    function createCalculatorCard(sourceFrame, index) {
      const card = document.createElement("article");
      card.className = "card";

      const cardHeader = document.createElement("div");
      cardHeader.className = "cardHeader";

      const title = document.createElement("h3");
      title.textContent = ["Пожар", "Металл", "АСТ кирпич_фасад"][index];
      cardHeader.appendChild(title);

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = calculatorDescriptions[index];
      cardHeader.appendChild(description);

      const frame = document.createElement("iframe");
      frame.className = "calculatorFrame";
      frame.title = sourceFrame.title;
      frame.srcdoc = sourceFrame.getAttribute("srcdoc");

      card.appendChild(cardHeader);
      card.appendChild(frame);
      return card;
    }

    async function loadShowcase() {
      try {
        const response = await fetch("../index.html");
        if (!response.ok) {
          throw new Error(`Не удалось загрузить index.html (HTTP ${response.status}).`);
        }

        const html = await response.text();
        const documentFromSource = new DOMParser().parseFromString(html, "text/html");
        const sourceFrames = Array.from(documentFromSource.querySelectorAll("iframe[srcdoc]"));

        if (sourceFrames.length !== 3) {
          throw new Error(`В index.html найдено ${sourceFrames.length} iframe вместо трёх.`);
        }

        sourceFrames.forEach((sourceFrame, index) => {
          calculatorGrid.appendChild(createCalculatorCard(sourceFrame, index));
        });
      } catch (error) {
        showError(`Витрина не загрузилась: ${error.message}`);
      }
    }

    loadShowcase();
  </script>
</body>
</html>
